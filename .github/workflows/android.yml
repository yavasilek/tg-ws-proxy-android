name: Native tests and Android APKs
on:
  push:
    branches: [main, sync-flowseal-rust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo test --locked --lib
      - run: cargo build --locked --lib
      - run: python3 tests/smoke_native.py target/debug/libtgwsproxy.so

  android:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android native targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36'
      - name: Build native libraries from source
        shell: bash
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CC_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi21-clang"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$CC_armv7_linux_androideabi"
          cargo build --locked --release --target aarch64-linux-android
          cargo build --locked --release --target armv7-linux-androideabi
          mkdir -p app/src/main/jniLibs/{arm64-v8a,armeabi-v7a}
          cp target/aarch64-linux-android/release/libtgwsproxy.so app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libtgwsproxy.so app/src/main/jniLibs/armeabi-v7a/
      - name: Build debug APKs
        run: bash gradlew :app:assembleArm64Debug :app:assembleArm32Debug :app:assembleUniversalDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tg-ws-proxy-android-debug
          path: app/build/outputs/apk/**/debug/*.apk
